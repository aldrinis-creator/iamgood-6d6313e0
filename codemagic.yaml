workflows:
  ios-workflow:
    name: iOS App Store Build
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      groups:
        # Apple Developer Portal credentials (configure these securely in the Codemagic UI)
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
